name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything: the URL library, the network layer on io_uring and on epoll, and the Quanta
  # bindings with WPT's url tests.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld make pkg-config liburing-dev libssl-dev zlib1g-dev libbrotli-dev libzstd-dev libnghttp2-dev libharfbuzz-dev

      - name: Show whether io_uring is available
        run: |
          uname -r
          cat /proc/sys/kernel/io_uring_disabled || true

      - name: Find the Quanta revision
        id: quanta
        run: echo "revision=$(git rev-parse HEAD:third_party/quanta)" >> "$GITHUB_OUTPUT"

      - name: Cache the Quanta build
        uses: actions/cache@v4
        with:
          path: third_party/quanta/build
          key: quanta-${{ runner.os }}-${{ steps.quanta.outputs.revision }}

      - run: make -j"$(nproc)" test

  # The tests that need no Quanta, under AddressSanitizer, UndefinedBehaviorSanitizer and leak detection.
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang make pkg-config liburing-dev libssl-dev zlib1g-dev libbrotli-dev libzstd-dev libnghttp2-dev libharfbuzz-dev
      - run: make asan-test

  # The URL library and the network layer, on kqueue. The Quanta bindings are Linux-only so far.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew install openssl@3 pkg-config zlib brotli zstd nghttp2 harfbuzz
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig" >> "$GITHUB_ENV"
      - run: make -j"$(sysctl -n hw.ncpu)" test

  # The same, on IO completion ports.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: make mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-openssl mingw-w64-clang-x86_64-pkgconf mingw-w64-clang-x86_64-zlib mingw-w64-clang-x86_64-brotli mingw-w64-clang-x86_64-zstd mingw-w64-clang-x86_64-nghttp2 mingw-w64-clang-x86_64-harfbuzz
      - run: make -j"$(nproc)" test

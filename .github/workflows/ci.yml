name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether the program's parts build and their own tests pass: the URL library, the network layer on io_uring and on epoll, and the Quanta bindings. (The WPT is wpt.yml: a page
  # of it that fails is not a build that fails.)
  linux:
    runs-on: ubuntu-24.04
    steps:
      # (Not ANGLE: it is only built by hand, for the program's WebGL on Windows and macOS.)
      - uses: actions/checkout@v4
      - name: Fetch the submodules the tests use
        run: git submodule update --init --depth 1 third_party/quanta third_party/skia third_party/angle tests/wpt
      # (Quanta's own submodules: its makefile fetches PCRE2 and mimalloc, but not utf8proc, which StringBuiltin.cpp includes. --recursive: PCRE2 has a submodule of its own, deps/sljit, that its JIT includes. ICU4X, the one more, is not built here.)
      - name: Fetch what Quanta's makefile does not
        run: git -C third_party/quanta submodule update --init --recursive --depth 1 third_party/utf8proc third_party/pcre2 third_party/mimalloc

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm make pkg-config liburing-dev libssl-dev zlib1g-dev libbrotli-dev libzstd-dev libnghttp2-dev libharfbuzz-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev

      - name: Show whether io_uring is available
        run: |
          uname -r
          cat /proc/sys/kernel/io_uring_disabled || true

      - name: Find the Quanta revision
        id: quanta
        run: echo "revision=$(git rev-parse HEAD:third_party/quanta)" >> "$GITHUB_OUTPUT"

      - name: Cache the Quanta build
        uses: actions/cache@v4
        with:
          path: third_party/quanta/build
          key: quanta-${{ runner.os }}-noicu-${{ steps.quanta.outputs.revision }}

      # (Without Intl: it is built on ICU4X, a submodule of Quanta's that this job does not fetch, and a Rust library; the tests here need neither.)
      # (Ubuntu 24.04 lets a process make a user namespace but takes its capabilities in it away, which a sandbox needs to write the map of its user: the runner is let do what a machine
      # that has not that restriction does.)
      - name: Let a process have the capabilities of its user namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: make -j"$(nproc)" ICU4X=0 test

      # Quanta's makefile keeps the compiler's messages in a file, not in the log.
      - name: What Quanta's compiler said
        if: failure()
        run: cat third_party/quanta/build/errors.log || true

  # The tests that need no Quanta, under AddressSanitizer, UndefinedBehaviorSanitizer and leak detection.
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang make pkg-config liburing-dev libssl-dev zlib1g-dev libbrotli-dev libzstd-dev libnghttp2-dev libharfbuzz-dev
      - run: make asan-test

  # The URL library and the network layer, on kqueue. The Quanta bindings are Linux-only so far.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew install openssl@3 pkg-config zlib brotli zstd nghttp2 harfbuzz
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig" >> "$GITHUB_ENV"
      # (The ANGLE headers: EGL and OpenGL ES, which macOS does not have.)
      - name: ANGLE's headers
        run: git submodule update --init --depth 1 third_party/angle
      - run: make -j"$(sysctl -n hw.ncpu)" SOLAR_DEBUG_INFO=1 test
      # A test that stops: where it did, by the debugger.
      - name: Where a test stopped
        if: failure()
        run: |
          for t in SessionTest StorageTest SettingsTest WireTest IpcTest; do
            echo "== $t"
            lldb --batch -o run -o "thread backtrace all" -- build/$t 2>&1 | tail -70 || true
          done

  # The same, on IO completion ports.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: make mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-openssl mingw-w64-clang-x86_64-pkgconf mingw-w64-clang-x86_64-zlib mingw-w64-clang-x86_64-brotli mingw-w64-clang-x86_64-zstd mingw-w64-clang-x86_64-nghttp2 mingw-w64-clang-x86_64-harfbuzz
      - run: make -j"$(nproc)" test

<!DOCTYPE html>
<meta charset="utf-8">
<title>Paint: gradients, shadows, outlines</title>
<style>
  body { margin: 0; padding: 20px; font: 14px sans-serif; background: #f4f4f6; }
  .row { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; }
  .box { width: 160px; height: 100px; border-radius: 12px; color: #fff; padding: 8px; box-sizing: border-box; font-weight: bold; }
  .lin { background: linear-gradient(135deg, #ff7a18, #af002d 70%, #319197); }
  .lin2 { background: linear-gradient(to right, red, yellow 30%, lime 60%, blue); }
  .lin3 { background: linear-gradient(to top right, #fff 0%, #000 100%); color: #888; }
  .rep { background: repeating-linear-gradient(45deg, #606dbc, #606dbc 10px, #465298 10px, #465298 20px); }
  .rad { background: radial-gradient(circle at 30% 30%, #ffe259, #ffa751 60%, #c0392b); }
  .rad2 { background: radial-gradient(ellipse closest-side, #00c6ff, #0072ff); }
  .con { background: conic-gradient(from 30deg, red, yellow, lime, aqua, blue, magenta, red); border-radius: 50%; }
  .stripe { background: linear-gradient(90deg, rgba(0,0,0,.6) 50%, transparent 50%) 0 0 / 20px 20px, #6a8; }
  .shadow { background: #fff; color: #222; box-shadow: 0 4px 12px rgba(0,0,0,.35); }
  .shadow2 { background: #fff; color: #222; box-shadow: 6px 6px 0 #e74c3c, 12px 12px 0 #f1c40f; }
  .inset { background: #dde; color: #222; box-shadow: inset 0 3px 8px rgba(0,0,0,.5), inset 0 -3px 8px rgba(255,255,255,.8); }
  .glow { background: #223; box-shadow: 0 0 20px 4px #0af; }
  .outline { background: #fff; color: #222; outline: 3px solid #e67e22; outline-offset: 4px; }
  .outline2 { background: #fff; color: #222; outline: 2px solid #8e44ad; outline-offset: -8px; }
  .text { font-size: 28px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,.5); color: #145; background: #fff; }
  .text2 { font-size: 28px; font-weight: bold; text-shadow: 0 0 6px #f0f, 0 0 12px #f0f; color: #fff; background: #222; }
  .mask { background: linear-gradient(90deg, #f06, #48f); -webkit-mask-image: linear-gradient(#000, transparent); mask-image: linear-gradient(#000, transparent); }
  .alpha { background: #f43; opacity: .55; }
  .sw { text-decoration: underline; text-decoration-color: red; }
</style>
<div class="row">
  <div class="box lin">linear 135deg</div>
  <div class="box lin2">to right</div>
  <div class="box lin3">to top right</div>
  <div class="box rep">repeating 45deg</div>
  <div class="box stripe">stripes</div>
</div>
<div class="row">
  <div class="box rad">radial circle</div>
  <div class="box rad2">radial ellipse</div>
  <div class="box con">conic</div>
  <div class="box mask">mask gradient</div>
  <div class="box alpha">opacity .55</div>
</div>
<div class="row">
  <div class="box shadow">box-shadow</div>
  <div class="box shadow2">hard shadows</div>
  <div class="box inset">inset</div>
  <div class="box glow">glow</div>
  <div class="box outline">outline 3px</div>
  <div class="box outline2">outline inset</div>
</div>
<div class="row">
  <div class="box text">text-shadow</div>
  <div class="box text2">neon</div>
  <div class="box"><span class="sw" style="color:#222">underline red</span></div>
</div>

<!doctype html>
<meta charset="utf-8">
<title>Media controls</title>
<style>body { margin: 8px; background: #eee; } video { display: block; width: 320px; margin-bottom: 8px; } #w { width: 560px; }</style>
<video id="v" src="media/test.mp4" controls></video>
<video id="w" src="media/test.mp4" controls></video>
<script>
// Needs tests/web-api/wsserver.py. The clicks are made as events with positions, as the window makes them.
const ok = (name, condition, detail) => console.log((condition ? "ok   " : "FAIL ") + name + (condition ? "" : "  " + detail));
const wait = (target, type, ms = 8000) => new Promise((resolve, reject) => { const t = setTimeout(() => reject(new Error("timeout waiting for " + type)), ms); target.addEventListener(type, (e) => { clearTimeout(t); resolve(e); }, { once: true }); });
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function run() {
  const v = document.getElementById("v"), w = document.getElementById("w");
  const ready = async (el) => { for (let i = 0; i < 200 && el.readyState < 3; i++) await sleep(50); };
  await ready(v);
  await ready(w);
  await sleep(200);
  let r = v.getBoundingClientRect();
  ok("the video has its size", Math.round(r.width) === 320 && Math.round(r.height) === 180 && v.controls === true, r.width + "x" + r.height);
  const mouse = (el, type, x, y) => { const b = el.getBoundingClientRect(); el.dispatchEvent(new MouseEvent(type, { clientX: b.left + x, clientY: b.top + y, bubbles: true, cancelable: true, button: 0 })); };
  const click = (el, x, y) => { mouse(el, "mousedown", x, y); mouse(el, "mouseup", x, y); mouse(el, "click", x, y); };
  // (320 wide: the play button 0-48, the position 52-120, the time 128-228, the sound 236-276, full screen 276-320; the bar is the last 48 of 180.)
  const bar = 156;

  click(v, 160, 60);
  await sleep(100);
  ok("a click on the picture plays", !v.paused, v.paused);
  click(v, 160, 60);
  await sleep(100);
  ok("and again pauses", v.paused, v.paused);

  click(v, 24, bar);
  await sleep(100);
  ok("the play button plays", !v.paused, v.paused);
  click(v, 24, bar);
  await sleep(100);
  ok("and pauses", v.paused, v.paused);

  v.muted = false;
  click(v, 256, bar);
  ok("the sound button mutes", v.muted === true, v.muted);
  click(v, 256, bar);
  ok("and unmutes", v.muted === false, v.muted);

  // the position
  const seeked = wait(v, "seeked");
  mouse(v, "mousedown", 86, bar);
  mouse(v, "mouseup", 86, bar);
  await seeked;
  ok("a press on the position seeks to it", Math.abs(v.currentTime - ((86 - 52) / (120 - 52)) * v.duration) < 0.2, `${v.currentTime} vs ${((86 - 52) / (120 - 52)) * v.duration}`);
  ok("the position does not play or pause", v.paused, v.paused);
  mouse(v, "mousedown", 60, bar);
  document.dispatchEvent(new MouseEvent("mousemove", { clientX: v.getBoundingClientRect().left + 110, clientY: 100, bubbles: true }));
  await sleep(200);
  document.dispatchEvent(new MouseEvent("mouseup", { bubbles: true }));
  ok("a drag follows the pointer", Math.abs(v.currentTime - ((110 - 52) / (120 - 52)) * v.duration) < 0.3, v.currentTime);

  // a wider one: the volume slider (560 wide, 315 high: full screen 516-560, the slider 444-508, the bar from y 267)
  r = w.getBoundingClientRect();
  ok("560 px wide", Math.round(r.width) === 560, r.width);
  w.volume = 1; w.muted = false;
  mouse(w, "mousedown", 476, 291);
  document.dispatchEvent(new MouseEvent("mouseup", { bubbles: true }));
  ok("a press on the volume slider sets the volume (halfway)", Math.abs(w.volume - 0.5) < 0.03 && !w.muted, w.volume);
  mouse(w, "mousedown", 444, 291);
  document.dispatchEvent(new MouseEvent("mouseup", { bubbles: true }));
  ok("and at its start it is muted", w.volume === 0 && w.muted, `${w.volume} ${w.muted}`);
  w.muted = false; w.volume = 1;

  // full screen
  ok("not full screen", document.fullscreenElement === null && document.fullscreenEnabled === true, String(document.fullscreenElement));
  const changed = wait(document, "fullscreenchange");
  click(w, 540, 291);
  await changed;
  ok("the full screen button: the element is full screen", document.fullscreenElement === w && w.hasAttribute("data-solar-fullscreen") && w.matches(":fullscreen"), String(document.fullscreenElement));
  await sleep(200);
  const f = w.getBoundingClientRect();
  ok("it fills the window", f.left === 0 && f.top === 0 && Math.round(f.width) === window.innerWidth && Math.round(f.height) === window.innerHeight, JSON.stringify(f));
  document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
  await sleep(100);
  ok("Escape leaves it", document.fullscreenElement === null && !w.hasAttribute("data-solar-fullscreen"), String(document.fullscreenElement));
  await sleep(100);
  const back = w.getBoundingClientRect();
  ok("and the video is as it was", Math.round(back.width) === 560 && Math.round(back.height) === 315, back.width + "x" + back.height);
  await w.requestFullscreen();
  await document.exitFullscreen();
  ok("requestFullscreen and exitFullscreen", document.fullscreenElement === null, "");

  // keys, while the pointer is over the video
  mouse(v, "mouseenter", 100, 60);
  v.currentTime = 1;
  await wait(v, "seeked");
  const key = (k) => document.dispatchEvent(new KeyboardEvent("keydown", { key: k, bubbles: true, cancelable: true }));
  key(" ");
  await sleep(100);
  ok("space plays", !v.paused, v.paused);
  key("k");
  await sleep(100);
  ok("k pauses", v.paused, v.paused);
  const before = v.currentTime;
  key("ArrowRight");
  await wait(v, "seeked");
  ok("the right arrow goes 5 s on", Math.abs(v.currentTime - Math.min(v.duration, before + 5)) < 0.2, `${before} -> ${v.currentTime}`);
  v.volume = 0.5;
  key("ArrowUp");
  ok("the up arrow turns the volume up", Math.abs(v.volume - 0.55) < 0.01, v.volume);
  key("m");
  ok("m mutes", v.muted === true, v.muted);
  key("m");
  mouse(v, "mouseleave", 100, 60);

  // without the attribute a click does nothing
  v.removeAttribute("controls");
  click(v, 160, 60);
  await sleep(100);
  ok("no controls attribute: no clicks taken", v.paused, v.paused);
  v.setAttribute("controls", "");
  v.currentTime = 2;
  await wait(v, "seeked");
  await sleep(100);
}
run().then(() => console.log("done"), (e) => { console.log("FAIL exception " + (e && e.stack || e)); console.log("done"); });
</script>

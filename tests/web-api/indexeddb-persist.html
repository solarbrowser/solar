<!doctype html><meta charset="utf-8"><script>
(async () => {
  const wait = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const out = [];
  const stage = location.hash.slice(1) || "write";
  if (stage === "write") {
    const open = indexedDB.open("persist", 2);
    open.onupgradeneeded = () => { const s = open.result.createObjectStore("s", { keyPath: "id" }); s.createIndex("byTag", "tag", { unique: false }); open.result.createObjectStore("plain", { autoIncrement: true }); };
    const db = await wait(open);
    const tx = db.transaction(["s", "plain"], "readwrite");
    for (let i = 1; i <= 5; i++) tx.objectStore("s").put({ id: i, tag: i % 2 ? "odd" : "even", date: new Date(1000 * i), map: new Map([[i, "v" + i]]), bytes: new Uint8Array([i, i + 1]), big: BigInt(i), neg: -0, nan: NaN, nested: { arr: [1, , 3] } });
    const cyc = { name: "cycle" }; cyc.self = cyc;
    tx.objectStore("plain").add(cyc);
    tx.objectStore("plain").add("text");
    await new Promise((r) => { tx.oncomplete = r; });
    out.push("written");
    await new Promise((r) => setTimeout(r, 400));
  } else {
    const db = await wait(indexedDB.open("persist"));
    out.push("version " + db.version + " stores " + [...db.objectStoreNames].join());
    const tx = db.transaction(["s", "plain"]);
    const all = await wait(tx.objectStore("s").getAll());
    out.push("count " + all.length);
    const r = all[2];
    out.push([r.id, r.date instanceof Date && r.date.getTime(), r.map instanceof Map && r.map.get(3), r.bytes instanceof Uint8Array && Array.from(r.bytes).join("-"), typeof r.big, Object.is(r.neg, -0), Number.isNaN(r.nan), r.nested.arr.length, 1 in r.nested.arr].join("|"));
    out.push("index " + (await wait(tx.objectStore("s").index("byTag").getAll("odd"))).length);
    const plain = await wait(tx.objectStore("plain").getAll());
    out.push("cycle " + (plain[0].self === plain[0]) + " text " + plain[1]);
    out.push("databases " + JSON.stringify(await indexedDB.databases()));
    if (stage === "delete") { await new Promise((r) => { db.close(); const d = indexedDB.deleteDatabase("persist"); d.onsuccess = r; }); out.push("after delete " + JSON.stringify(await indexedDB.databases())); }
  }
  for (const l of out) console.log(l);
})();
</script>

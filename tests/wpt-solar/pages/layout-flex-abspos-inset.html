<!doctype html>
<title>An inset places a positioned child of a flex container</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
  body { margin: 0; }
  #col { display: flex; flex-direction: column; min-height: 100%; }
  #main { height: 3000px; }
  #bar { position: fixed; bottom: 0; left: 0; right: 0; display: flex; flex-direction: column; }
  #bar div { height: 70px; }
  #row { display: flex; position: relative; height: 200px; width: 300px; }
  #end { position: absolute; bottom: 0; right: 0; width: 20px; height: 30px; }
  #stat { position: absolute; width: 20px; height: 30px; }
  #colb { display: flex; flex-direction: column; justify-content: flex-end; position: relative; height: 200px; }
  #colb-stat { position: absolute; width: 20px; height: 30px; }
</style>
<body>
<div id="col"><div id="main"></div><div id="bar"><div></div></div></div>
<div id="row"><div id="end"></div><div id="stat"></div></div>
<div id="colb"><div id="colb-stat"></div></div>
<script>
// `bottom: 0` of a fixed bar in a column container puts it at the bottom of the viewport; justify-content only moves a box whose insets are auto.
test(() => {
  const r = document.getElementById("bar").getBoundingClientRect();
  assert_equals(r.bottom, innerHeight, "bottom edge");
  assert_equals(r.top, innerHeight - 70, "top edge");
  assert_equals(r.width, document.documentElement.clientWidth, "left and right are both given");
}, "fixed bar with bottom: 0 in a column flex container");
test(() => {
  const r = document.getElementById("end").getBoundingClientRect(), p = document.getElementById("row").getBoundingClientRect();
  assert_equals(r.bottom, p.bottom);
  assert_equals(r.right, p.right);
}, "bottom and right of an absolute child in a row flex container");
test(() => {
  const r = document.getElementById("colb-stat").getBoundingClientRect(), p = document.getElementById("colb").getBoundingClientRect();
  assert_equals(r.bottom, p.bottom, "the static position follows justify-content");
}, "auto insets: justify-content still aligns the static position");
</script>

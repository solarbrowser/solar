<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Solar</title>
<style>
  :root {
    --strip: #e4e7ee;
    --tab-hover: rgba(255, 255, 255, 0.55);
    --bar: #f3f4f7;
    --bar-edge: #d9dce3;
    --field: #e6e8ee;
    --field-hover: #dcdfe7;
    --field-focus: #ffffff;
    --text: #1d2026;
    --dim: #6b7280;
    --accent: #3b6cf6;
    --button-hover: rgba(30, 40, 70, 0.09);
    --button-down: rgba(30, 40, 70, 0.16);
    --icon: #3d4351;
    --icon-off: #b3b8c4;
    --secure: #1f9d55;
    --warning: #c47f0a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --strip: #14161b;
      --tab-hover: rgba(255, 255, 255, 0.07);
      --bar: #1f2128;
      --bar-edge: #12141a;
      --field: #2d3039;
      --field-hover: #353945;
      --field-focus: #15171c;
      --text: #e8eaf0;
      --dim: #949bab;
      --accent: #7a9bff;
      --button-hover: rgba(255, 255, 255, 0.09);
      --button-down: rgba(255, 255, 255, 0.16);
      --icon: #c9cedb;
      --icon-off: #4d5362;
      --secure: #4cc38a;
      --warning: #e6a93a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 88px; overflow: hidden; background: var(--bar); font: 14px/1.2 system-ui, "Noto Sans", "DejaVu Sans", Arial, sans-serif; color: var(--text); -webkit-user-select: none; user-select: none; }
  #strip { display: flex; align-items: flex-end; height: 40px; padding: 0 0 0 8px; background: var(--strip); }
  #tabs { display: flex; align-items: flex-end; min-width: 0; flex: 0 1 auto; gap: 2px; }
  .tab { position: relative; display: flex; align-items: center; flex: 0 1 220px; min-width: 44px; width: 220px; height: 34px; padding: 0 6px 0 12px; border-radius: 10px 10px 0 0; color: var(--dim); }
  .tab:hover { background: var(--tab-hover); }
  .tab.active { background: var(--bar); color: var(--text); }
  .tab .icon { flex: none; width: 16px; height: 16px; margin-right: 8px; border-radius: 8px; background: transparent; }
  .tab img.icon { background: transparent; border-radius: 3px; object-fit: contain; }
  .tab.loading .icon { opacity: 0.45; }
  .tab .label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
  .tab .close { flex: none; width: 20px; height: 20px; margin-left: 4px; border-radius: 10px; opacity: 0; }
  .tab:hover .close, .tab.active .close { opacity: 1; }
  .tab .close svg { width: 16px; height: 16px; color: var(--dim); }
  .tab .close:hover { background: var(--button-hover); }
  #newtab { width: 30px; height: 30px; margin: 0 4px 3px 4px; border-radius: 15px; }
  #newtab svg { width: 20px; height: 20px; }
  #drag { flex: 1; align-self: stretch; min-width: 20px; }
  .win { width: 46px; height: 40px; border-radius: 0; }
  .win svg { width: 16px; height: 16px; }
  #wclose:hover { background: #d93a3a; }
  #wclose:hover svg { color: #fff; }
  #controls { display: none; }
  .controlled #controls { display: flex; }
  #bar { position: relative; display: flex; align-items: center; height: 48px; padding: 0 10px; gap: 4px; border-bottom: 1px solid var(--bar-edge); }
  button { all: unset; box-sizing: border-box; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 18px; cursor: default; }
  svg { width: 24px; height: 24px; }
  button svg { color: var(--icon); }
  button:hover { background: var(--button-hover); }
  button:active { background: var(--button-down); }
  button[disabled] { pointer-events: none; }
  button[disabled] svg { color: var(--icon-off); }
  #field { position: relative; flex: 1; display: flex; align-items: center; height: 38px; margin: 0 8px; padding: 0 14px 0 12px; border-radius: 19px; background: var(--field); border: 2px solid transparent; }
  #field:hover { background: var(--field-hover); }
  #field.focused { background: var(--field-focus); border-color: var(--accent); }
  #site { display: flex; align-items: center; justify-content: center; flex: none; width: 20px; height: 20px; margin-right: 8px; }
  #site svg { width: 18px; height: 18px; }
  #site svg { color: var(--dim); }
  #field.secure #site svg { color: var(--secure); }
  #field.insecure #site svg { color: var(--warning); }
  #shown { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
  #shown b { font-weight: 400; color: var(--text); }
  #shown i { font-style: normal; }
  #address { display: none; flex: 1; min-width: 0; border: none; outline: 1px solid transparent; background: transparent; color: var(--text); font: inherit; padding: 0; -webkit-user-select: text; user-select: text; }
  #field.focused #shown { display: none; }
  #field.focused #address { display: block; }
  #progress { position: absolute; left: 0; bottom: -1px; height: 2px; width: 0; background: var(--accent); opacity: 0; transition: opacity 0.2s; }
  #progress.on { opacity: 1; width: 100%; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -30%; width: 30%; } 100% { margin-left: 100%; width: 30%; } }
</style>
</head>
<body>
<div id="strip">
  <div id="tabs"></div>
  <button id="newtab" title="New tab">{{icon:add}}</button>
  <div id="drag"></div>
  <div id="controls">
    <button class="win" id="wmin" title="Minimize">{{icon:minimize}}</button>
    <button class="win" id="wmax" title="Maximize">{{icon:crop-square}}</button>
    <button class="win" id="wclose" title="Close">{{icon:close}}</button>
  </div>
</div>
<div id="bar">
  <button id="back" title="Back" disabled>{{icon:chevron-left}}</button>
  <button id="forward" title="Forward" disabled>{{icon:chevron-right}}</button>
  <button id="reload" title="Reload">{{icon:reload}}</button>
  <div id="field">
    <span id="site">{{icon:public}}</span>
    <div id="shown">Search or enter an address</div>
    <input id="address" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter an address">
  </div>
  <div id="progress"></div>
</div>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const send = (text) => { if (typeof __solarUiSend === "function") __solarUiSend(text); };
  const field = $("field"), address = $("address"), shown = $("shown"), site = $("site");
  const lock = '{{icon:security}}';
  const open = '{{icon:security-off}}';
  const globe = site.innerHTML;
  let state = { url: "", title: "", back: false, forward: false, loading: false, tabs: [], active: 0, controls: false, maximized: false };
  const esc = (t) => t.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

  // The tabs: an icon with the first letter of the site, the title (or the site), a button to close it.
  const tabsBox = $("tabs");
  const nameOf = (t) => {
    if (/^solar:\/\/newtab/.test(t.url) || (!t.url && !t.title)) return "New tab";
    if (t.title && !t.title.startsWith("Solar - ")) return t.title;
    const m = /^[a-z]+:\/\/([^\/?#]*)/.exec(t.url);
    return m ? m[1].replace(/^www\./, "") : t.url;
  };
  const cross = '{{icon:close}}';
  // The pictures the browser fetched for the tabs: kept for the site the tab is on, dropped when the tab goes to another.
  const icons = {}, iconSite = {};
  const siteOf = (url) => { const m = /^[a-z]+:\/\/([^\/?#]*)/.exec(url || ""); return m ? m[1] : ""; };
  let lastTabs = "";
  const renderTabs = () => {
    for (const t of state.tabs) { if (icons[t.id] && iconSite[t.id] !== siteOf(t.url)) { delete icons[t.id]; delete iconSite[t.id]; } }
    for (const id of Object.keys(icons)) { if (!state.tabs.some((t) => String(t.id) === id)) { delete icons[id]; delete iconSite[id]; } }
    const key = JSON.stringify([state.tabs, state.active, Object.keys(icons).map((id) => id + ":" + icons[id].length)]);
    if (key === lastTabs) return;
    lastTabs = key;
    let html = "";
    for (const t of state.tabs) {
      const blank = /^solar:\/\/newtab/.test(t.url) || !t.url;
      const name = nameOf(t);
      html += '<div class="tab' + (t.id === state.active ? " active" : "") + (t.loading ? " loading" : "") + (blank ? " blank" : "") + '" data-id="' + t.id + '">' + (icons[t.id] && !blank ? '<img class="icon" src="' + icons[t.id] + '">' : '<span class="icon"></span>') + '<span class="label">' + esc(name) + '</span><button class="close" data-id="' + t.id + '">' + cross + "</button></div>";
    }
    tabsBox.innerHTML = html;
  };
  let lastDrag = "";
  const reportDrag = () => {
    const r = $("drag").getBoundingClientRect();
    const text = Math.round(r.left) + "," + Math.round(r.right);
    if (text !== lastDrag) { lastDrag = text; send("drag\t" + text); }
  };

  // The address as it is shown when it is not being edited: the host in the text colour, the rest dimmed, the scheme left out for the web.
  const render = () => {
    const url = state.url;
    let kind = "";
    let html = "";
    if (!url || /^solar:\/\/newtab/.test(url)) {
      html = "Search or enter an address";
    } else {
      const m = /^(https?):\/\/([^\/?#]*)([^]*)$/.exec(url);
      if (m) {
        kind = m[1] === "https" ? "secure" : "insecure";
        const host = m[2].replace(/^www\./, "");
        const rest = m[3] === "/" ? "" : m[3];
        html = (m[1] === "http" ? "<i>http://</i>" : "") + "<b>" + esc(host) + "</b><i>" + esc(rest) + "</i>";
      } else {
        html = "<b>" + esc(url) + "</b>";
      }
    }
    shown.innerHTML = html;
    field.className = (field.classList.contains("focused") ? "focused " : "") + kind;
    site.innerHTML = kind === "secure" ? lock : kind === "insecure" ? open : globe;
    if (!field.classList.contains("focused")) address.value = /^solar:\/\/newtab/.test(url) ? "" : url;
    $("wmax").innerHTML = state.maximized ? restoreIcon : maxIcon;
    $("wmax").title = state.maximized ? "Restore" : "Maximize";
    renderTabs();
    document.documentElement.className = state.controls ? "controlled" : "";
    document.body.className = (state.loading ? "loading " : "") + (state.controls ? "controlled" : "");
    reportDrag();
    $("back").disabled = !state.back;
    $("forward").disabled = !state.forward;
    $("progress").className = state.loading ? "on" : "";
  };

  const shownUrl = () => (/^solar:\/\/newtab/.test(state.url) ? "" : state.url);
  globalThis.__solarUiState = (next) => {
    if (next.icon) {
      const t = state.tabs.find((x) => x.id === next.icon.tab);
      if (t) { icons[t.id] = next.icon.data; iconSite[t.id] = siteOf(t.url); renderTabs(); }
      return;
    }
    const before = state.active;
    state = Object.assign(state, next);
    render();
    // (Another tab: what was being typed is for the tab it was typed in.)
    if (next.active !== undefined && next.active !== before) address.value = shownUrl();
    if (next.focusAddress) edit();
    if (next.blur) address.blur();
  };

  const edit = () => { if (!field.classList.contains("focused")) { field.classList.add("focused"); send("focus\t1"); address.value = shownUrl(); } address.focus(); address.select(); };
  const leave = () => { if (field.classList.contains("focused")) { field.classList.remove("focused"); send("focus\t0"); render(); } };

  field.addEventListener("mousedown", () => { if (!field.classList.contains("focused")) setTimeout(edit, 0); });
  address.addEventListener("focus", () => { if (!field.classList.contains("focused")) { field.classList.add("focused"); send("focus\t1"); } });
  address.addEventListener("blur", leave);
  address.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { const text = address.value; leave(); address.blur(); send("go\t" + text); }
    else if (e.key === "Escape") { address.value = shownUrl(); leave(); address.blur(); }
  });
  // (A picture that cannot be shown goes: the letter is there instead.)
  tabsBox.addEventListener("error", (e) => {
    const tab = e.target && e.target.closest ? e.target.closest(".tab") : null;
    if (tab) { delete icons[tab.dataset.id]; lastTabs = ""; renderTabs(); }
  }, true);
  tabsBox.addEventListener("mousedown", (e) => {
    const close = e.target.closest ? e.target.closest(".close") : null;
    const tab = e.target.closest ? e.target.closest(".tab") : null;
    if (close) send("close\t" + close.dataset.id);
    else if (tab) send("activate\t" + tab.dataset.id);
  });
  $("newtab").addEventListener("click", () => send("newtab"));
  $("wmin").addEventListener("click", () => send("min"));
  $("wmax").addEventListener("click", () => send("max"));
  const maxIcon = '{{icon:crop-square}}', restoreIcon = '{{icon:image-filter-none}}';
  $("wclose").addEventListener("click", () => send("quit"));
  window.addEventListener("resize", reportDrag);
  $("back").addEventListener("click", () => send("back"));
  $("forward").addEventListener("click", () => send("forward"));
  $("reload").addEventListener("click", () => send("reload"));
  render();
  send("ready");
})();
</script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Solar</title>
<style>
{{include:css}}
  #side { position: absolute; left: 0; top: 0; bottom: 0; width: 272px; display: flex; flex-direction: column; background: var(--strip); border-right: 1px solid var(--bar-edge); }
  #sidehead { display: flex; align-items: center; flex: none; height: 44px; padding: 0 8px; gap: 2px; }
  #sidehead button { width: 32px; height: 32px; border-radius: 8px; }
  #sidehead button svg { width: 22px; height: 22px; }
  #sidehead .win { width: 34px; height: 28px; margin-left: 0; }
  #sidehead .win svg { width: 16px; height: 16px; }
  #drag { flex: 1; align-self: stretch; min-width: 12px; }
  #controls { margin: 0; }
  #fieldrow { position: relative; flex: none; padding: 2px 10px 10px; }
  #field { margin: 0; height: 40px; border-radius: 12px; }
  #progress { left: 10px; right: 10px; bottom: 6px; width: auto; border-radius: 1px; }
  #progress.on { width: auto; animation: none; }
  #list { flex: 1; min-height: 0; overflow: hidden; padding: 4px 10px 8px; }
  #tabs { display: flex; flex-wrap: wrap; align-content: flex-start; }
  .tab { position: relative; display: flex; align-items: center; width: 100%; height: 38px; margin-bottom: 2px; padding: 0 6px 0 12px; border-radius: 10px; color: var(--dim); }
  .tab:hover { background: var(--tab-hover); }
  .tab.active { background: var(--bar); color: var(--text); box-shadow: 0 1px 2px rgba(25, 35, 70, 0.14); }
  .tab.pinned { width: 76px; height: 48px; margin: 0 8px 8px 0; padding: 0; justify-content: center; background: var(--tab-hover); border-radius: 12px; }
  .tab.pinned:nth-child(3n) { margin-right: 0; }
  .tab.pinned.active { background: var(--bar); }
  .tab.pinned .label, .tab.pinned .close { display: none; }
  .tab.pinned .icon { margin: 0; width: 22px; height: 22px; }
  #newtab { width: 100%; height: 38px; margin-top: 2px; padding: 0 12px; justify-content: flex-start; font-size: 13px; color: var(--dim); }
  #newtab svg { width: 18px; height: 18px; margin-right: 10px; color: var(--dim); }
  #newtab:hover { background: var(--tab-hover); color: var(--text); }
  #foot { display: flex; align-items: center; flex: none; height: 48px; padding: 0 10px; border-top: 1px solid var(--bar-edge); }
  #foot #menuButton { margin: 0; }
  #menu { top: auto; bottom: 56px; left: 10px; right: auto; }
</style>
</head>
<body data-axis="y" data-top="0">
<div id="side">
  <div id="sidehead">
    <button id="back" title="Back" disabled>{{icon:chevron-left}}</button>
    <button id="forward" title="Forward" disabled>{{icon:chevron-right}}</button>
    <button id="reload" title="Reload">{{icon:refresh}}</button>
    <div id="drag"></div>
    <div id="controls">
      <button class="win" id="wmin" title="Minimize"></button>
      <button class="win" id="wmax" title="Maximize"></button>
      <button class="win" id="wclose" title="Close"></button>
    </div>
  </div>
  <div id="fieldrow">
    <div id="field">
      <span id="site">{{icon:public}}</span>
      <div id="shown">Search or enter an address</div>
      <input id="address" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter an address">
    <button id="zoomchip" title="Reset the zoom"></button>
    </div>
    <div id="progress"></div>
  </div>
  <div id="list">
    <div id="tabs"></div>
    <button id="newtab" title="New tab">{{icon:add}}<span>New tab</span></button>
  </div>
  <div id="foot">
    <button id="menuButton" title="Menu">{{icon:hamburger-menu}}</button>
    <button id="dlbutton" title="Downloads">{{icon:tray-download}}</button>
  </div>
</div>
{{include:menu}}
<script>
{{include:js}}
</script>
</body>
</html>

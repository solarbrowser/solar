<div id="menu">
  <button class="item" data-do="newtab">{{icon:add}}<span>New tab</span><small>Ctrl+T</small></button>
  <hr>
  <button class="item" data-do="downloads">{{icon:tray-download}}<span>Downloads</span></button>
  <button class="item" data-do="find">{{icon:search}}<span>Find in page</span><small>Ctrl+F</small></button>
  <div class="item zoomrow">
    <span>Zoom</span>
    <button data-zoom="-1" title="Zoom out">{{icon:minimize}}</button>
    <b id="menuzoom">100%</b>
    <button data-zoom="1" title="Zoom in">{{icon:add}}</button>
  </div>
  <hr>
  <button class="item" data-do="settings">{{icon:settings}}<span>Settings</span></button>
  <button class="item" data-do="quit">{{icon:close}}<span>Exit</span></button>
</div>
